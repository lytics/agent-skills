name: Tag release from CHANGELOG

# The version is decided in the PR (the top "## [x.y.z]" heading in CHANGELOG.md);
# this tags the commit that lands it on main, so nobody has to tag by hand after merge.
on:
  push:
    branches: [main]
    paths: [CHANGELOG.md]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tag-release
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tag the top released version if it is new
        run: |
          set -euo pipefail
          version=$(sed -n -E 's/^## \[([0-9]+\.[0-9]+\.[0-9]+)\].*/\1/p' CHANGELOG.md | head -n 1)
          if [ -z "$version" ]; then
            echo "No '## [x.y.z]' heading in CHANGELOG.md; nothing to tag."
            exit 0
          fi
          tag="v${version}"
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null; then
            echo "${tag} already exists; nothing to do."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${tag}" -m "${tag}" "${GITHUB_SHA}"
          git push origin "refs/tags/${tag}"
          echo "Tagged ${GITHUB_SHA} as ${tag}."
